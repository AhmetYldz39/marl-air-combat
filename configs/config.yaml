# =============================================================================
# config.yaml
# MARL Hava Muharebe Simülasyonu — Ana Konfigürasyon
#
# Kullanım:
#   import yaml
#   with open("configs/config.yaml") as f:
#       config = yaml.safe_load(f)
#
# Bölümler:
#   aircraft        : F-16 fiziksel parametreleri
#   aero_coeffs     : JSBSim aerodinamik katsayıları
#   control_limits  : Kontrol yüzeyi sınırları
#   weapons         : Silah sistemi parametreleri
#   env             : Simülasyon ortam ayarları
#   reward          : Reward ağırlıkları
#   roles           : Aggression skalası lerp uç noktaları
#   coord           : Takım koordinasyon mesafe parametreleri
#   training        : Eğitim hiperparametreleri
#   curriculum      : Curriculum geçiş kriterleri
#   logging         : Logging ve checkpoint ayarları
#   eval            : Değerlendirme ayarları
#
# Kaynak:
#   JSBSim F-16 katsayıları: Stevens & Lewis "Aircraft Control and Simulation"
#   WEZ parametreleri       : Tecrübe + literatür
# =============================================================================


# -----------------------------------------------------------------------------
# AIRCRAFT — F-16 Fiziksel Parametreleri
# Kaynak: JSBSim F-16 model, Stevens & Lewis
# -----------------------------------------------------------------------------
aircraft:

  # Kütle ve geometri
  mass:       9100.0      # kg  — yakıtsız operasyonel kütle yaklaşımı
  wingspan:   9.45        # m
  wing_area:  27.87       # m²
  mean_chord: 3.45        # m   — ortalama aerodinamik kiriş

  # Atalet momentleri (kg·m²)
  # Ixz cross-inertia dahil — roll-yaw coupling F-16'da önemli
  Ixx:  12875.0
  Iyy:  75674.0
  Izz:  85552.0
  Ixz:   1331.0           # ihmal edilmez — yüksek açı performansını etkiler

  # İtki sistemi (F110-GE-100)
  max_thrust: 76300.0     # N   — deniz seviyesi afterburner
  SFC:        0.00002     # kg/(N·s) — spesifik yakıt tüketimi

  # Başlangıç kaynakları
  initial_fuel: 3000.0    # kg
  initial_ammo: 6         # adet (BVR füze benzeri)
  initial_hp:   1.0       # [0, 1]

  # Sensör
  radar_range: 15000.0    # m

  # Operasyonel limitler
  V_min:     60.0         # m/s — minimum uçuş hızı (stall koruması)
  V_max:    600.0         # m/s — maksimum hız (yapısal limit)
  h_min:     50.0         # m   — minimum irtifa (zemin koruması)
  alpha_max:  0.4363      # rad — 25.0° (stall sınırı)
  alpha_min: -0.1745      # rad — -10.0°


# -----------------------------------------------------------------------------
# AERO_COEFFS — JSBSim F-16 Aerodinamik Katsayıları
# Kaynak: Stevens & Lewis, Nguyen et al. (1979) NASA TP-1538
# -----------------------------------------------------------------------------
aero_coeffs:

  # Kaldırma kuvveti
  CL0:       0.0          # sıfır alpha kaldırması
  CL_alpha:  5.5          # /rad
  CL_q:      1.8          # pitch rate etkisi
  CL_de:     0.5          # elevator etkisi

  # Sürükleme kuvveti
  CD0:       0.013        # sıfır kaldırma sürüklemesi
  CD_alpha:  0.5          # /rad²  (indüklenmiş sürükleme yaklaşımı)

  # Yan kuvvet
  CY_beta:  -0.35         # /rad
  CY_da:     0.0          # aileron cross-etkisi (ihmal)
  CY_dr:     0.10         # rudder etkisi

  # Roll moment
  Cl_p:     -0.41         # roll damping /rad·s
  Cl_r:      0.15         # yaw-to-roll coupling
  Cl_da:     0.18         # aileron kontrol etkinliği
  Cl_dr:     0.01         # rudder cross-etkisi

  # Pitch moment
  Cm0:       0.04         # sıfır alpha pitch moment
  Cm_alpha: -0.65         # statik longitudinal stabilite /rad
  Cm_q:    -12.4          # pitch damping /rad·s
  Cm_de:    -1.1          # elevator kontrol etkinliği

  # Yaw moment
  Cn_p:     -0.05         # roll-to-yaw coupling
  Cn_r:     -0.20         # yaw damping /rad·s
  Cn_da:    -0.02         # adverse yaw
  Cn_dr:     0.15         # rudder kontrol etkinliği


# -----------------------------------------------------------------------------
# CONTROL_LIMITS — F-16 Kontrol Yüzeyi Fiziksel Limitleri
# -----------------------------------------------------------------------------
control_limits:
  aileron_max_deg:   21.5   # ±21.5°
  elevator_max_deg:  25.0   # ±25.0°
  rudder_max_deg:    30.0   # ±30.0°


# -----------------------------------------------------------------------------
# WEAPONS — Silah Sistemi
# WEZ: Weapon Engagement Zone (BVR füze benzeri model)
# -----------------------------------------------------------------------------
weapons:
  wez_range_max:   8000.0   # m   — maksimum etkili menzil
  wez_range_min:    300.0   # m   — minimum güvenli ateş mesafesi
  wez_angle_max:     30.0   # deg — WEZ yarı açısı (±30° boresight'tan)
  missile_damage:     0.6   # [0,1] — tek isabet hasarı
  fire_cooldown:      0.5   # s   — ard arda ateş arası bekleme
  min_fire_altitude:  200.0 # m   — zemin yakını ateş yasağı


# -----------------------------------------------------------------------------
# ENV — Simülasyon Ortam Ayarları
# -----------------------------------------------------------------------------
env:

  # Harita
  map_size:   50000.0     # m   — kare harita kenar uzunluğu (±25km)
  h_max:      15000.0     # m   — maksimum irtifa (observation normalize için)

  # Fizik
  dt:           0.05      # s   — RK4 entegrasyon adımı (6-DoF için 20 Hz)
  max_steps:  1000        # adım — episode uzunluğu (1000 × 0.05s = 50s)

  # Angular hız sınırları (normalize için kullanılır, fizik modeli kullanmaz)
  p_max:  3.0             # rad/s
  q_max:  3.0             # rad/s
  r_max:  3.0             # rad/s

  # Senaryo
  n_agents_per_team:  2   # Faz 0-1: 2v2, Faz 4: 3v3
  n_teams:            2

  # Episode başlangıç spawn (random box)
  spawn_x_range:    10000.0   # m   — ±10 km Doğu-Batı
  spawn_y_range:    10000.0   # m   — ±10 km Kuzey-Güney
  spawn_h_min:       3000.0   # m
  spawn_h_max:       8000.0   # m
  spawn_V_min:        150.0   # m/s
  spawn_V_max:        280.0   # m/s
  spawn_team_offset:  8000.0  # m   — iki takım arasındaki başlangıç ayrımı


# -----------------------------------------------------------------------------
# REWARD — Reward Ağırlıkları
# r_total = Σ w_i × r_i
#
# Draw problemi geçmişte: r_wez ve r_tracking çok düşük kalmıştı.
# Mevcut ağırlıklar bu dersten çıkarılarak revize edilmiştir.
# -----------------------------------------------------------------------------
reward:
  w_kill:      25.0    # r_kill      — düşman imhası (anlık)
  w_wez:        5.0    # r_wez       — WEZ avantajı [0,1] sürekli
  w_tracking:   6.0    # r_tracking  — radar izleme kalitesi
  w_survival:   0.0    # r_survival  — hayatta kalma (dt başına, pasif uçuşu teşvik etmemek için 0)
  w_coord:      0.5    # r_coord     — takım koordinasyonu
  w_resource:   0.1    # r_resource  — yakıt/ammo verimliliği
  w_penalty:   -5.0    # r_penalty   — tehlikeli davranış (negatif!)
  w_role:       1.0    # r_role      — aggression uyumu (Faz 2+)
  w_pursuit:    2.5    # r_pursuit   — düşmana yaklaşma teşviki [0, 0.3]
  pursuit_norm_dist: 10000.0  # r_pursuit normalizasyon mesafesi (m)
  team_kill_bonus: 15.0  # r_team_kill — tüm düşmanlar imha edilince bonus
  w_smooth_ctrl:     0.05   # r_smooth    — kontrol yüzeyi jitter cezası (ail/elev/rud)
  w_smooth_throttle: 0.003  # r_smooth    — throttle değişim cezası (gevşek)
  w_throttle_ctx:    0.8    # r_throttle  — ATA+mesafe bazlı throttle yönlendirme
  w_support:            1.5    # r_support   — takım arkadaşı WEZ aktifken ikinci hedefe destek
  ammo_miss_penalty:    0.5    # WEZ dışı ateş cezası (resource reward içinde)
  w_role_match:         1.0    # r_role_match — RoleSelector çıktısına uyumlu davranış bonusu
  w_sniper_position:    1.5    # r_sniper_pos — SNIPER: WEZ optimal mesafe (Gaussian ~3000m)
  w_defensive_survival: 5.0    # DEFENSIVE rolü için ekstra survival katkısı (w_survival=0 geçersiz kılar)
  w_sniper_patience:    1.0    # SNIPER: WEZ içinde ateş etmeden bekleme bonusu (+0.5)
  w_evasion:            2.0    # DEFENSIVE rolü için uzaklaşma ödülü (r_closing'in tersi)


# -----------------------------------------------------------------------------
# ROLES — Aggression Skalası Lerp Uç Noktaları
#
# aggression ∈ [0.0, 1.0]
#   0.0 = tam defansif  →  *_at_0 değerleri
#   1.0 = tam agresif   →  *_at_1 değerleri
#
# Ağırlık ölçekleri:
#   aggression | w_kill | w_survival | w_coord
#   -----------|--------|-----------|--------
#        0.0   |   0.5  |    2.0    |   1.5
#        0.25  |  0.875 |   1.625   |  1.375
#        0.5   |  1.25  |   1.25    |  1.25
#        0.75  |  1.625 |   0.875   |  1.125
#        1.0   |   2.0  |    0.5    |   1.0
#
# Faz 0-1: dogfight_env.py aggression=None geçirir → scale=1.0 (pasif)
# Faz 2  : aggression=0.5 ile başlanır, curriculum ile dinamik ayarlanır
# -----------------------------------------------------------------------------
roles:

  # Ana ağırlık lerp uç noktaları
  w_kill_at_0:      0.5    # defansif tarafta kill ağırlığı düşük
  w_kill_at_1:      2.0    # agresif tarafta kill ağırlığı yüksek
  w_survival_at_0:  2.0    # defansif: hayatta kalmak kritik
  w_survival_at_1:  0.5    # agresif: risk almak kabul edilebilir
  w_coord_at_0:     1.5    # defansif: takım koruması önemli
  w_coord_at_1:     1.0    # agresif: koordinasyon ikincil

  # r_role_bonus bileşen ağırlıkları (aggression → bonus kaynağı değişir)
  role_kill_weight_at_0:      0.0   # defansif: kill bonusu yok
  role_kill_weight_at_1:      1.0   # agresif: bonus tamamen kill'den
  role_survival_weight_at_0:  0.5   # defansif: bonusun yarısı survival
  role_survival_weight_at_1:  0.0   # agresif: survival bonusu yok
  role_coord_weight_at_0:     0.5   # defansif: bonusun yarısı koordinasyon
  role_coord_weight_at_1:     0.0   # agresif: koordinasyon bonusu yok

  # Faz 2 başlangıç ve sınırlar (curriculum_manager kullanır)
  aggression_default: 0.5
  aggression_min:     0.0
  aggression_max:     1.0


# -----------------------------------------------------------------------------
# COORD — Takım Koordinasyon Mesafe Parametreleri
# r_coord Gaussian hesabı için kullanılır
# -----------------------------------------------------------------------------
coord:
  dist_min:  500.0    # m   — bu altı çok yakın → ceza bölgesi
  dist_max:  8000.0   # m   — bu üstü çok uzak → ceza bölgesi
  dist_opt:  3000.0   # m   — optimal takım mesafesi (Gaussian tepe)


# -----------------------------------------------------------------------------
# TRAINING — Eğitim Hiperparametreleri
# Faz 1: MAPPO baseline, Faz 2+: GAT ve opponent model eklenir
# -----------------------------------------------------------------------------
training:

  # Genel
  algorithm:          "mappo"       # mappo | qmix | maddpg
  total_timesteps:    50_000_000    # Option-B role fix run: ep37000 (29.3M) + 20M yeni adım
  seed:               42

  # PPO / MAPPO
  lr_actor:           0.0003
  lr_critic:          0.0003
  gamma:              0.99          # discount faktörü
  gae_lambda:         0.95          # GAE lambda
  clip_epsilon:       0.2           # PPO clip
  entropy_coeff:      0.15          # keşif teşviki
  mean_penalty_coeff: 0.01          # action mean L2 penalty (satürasyon önleme)
  value_loss_coeff:   0.5
  max_grad_norm:      0.5

  # Rollout ve güncelleme
  n_steps:            512           # adım / rollout
  n_epochs:           4             # PPO güncelleme epoch sayısı
  batch_size:         512
  minibatch_size:     128

  # QMIX (karşılaştırma için)
  qmix_mixing_embed:  32
  qmix_hypernet_embed: 64

  # MADDPG (karşılaştırma için)
  maddpg_tau:         0.005         # soft update katsayısı
  maddpg_buffer_size: 100_000
  maddpg_warmup:      1000


# -----------------------------------------------------------------------------
# CURRICULUM — Faz Geçiş Kriterleri
# curriculum_manager.py bu değerleri okur
# -----------------------------------------------------------------------------
curriculum:

  # Faz 0 → 1: Fizik sanity check
  phase0_to_1:
    min_episodes:         100
    max_crash_rate:       0.0       # sıfır crash zorunlu

  # Faz 1 → 2: Temel dövüş yetkinliği
  phase1_to_2:
    eval_window:          200       # son N episode
    min_win_rate:         0.40      # ≥ %40 kazanma
    min_kill_per_ep:      0.8       # episode başı ortalama kill
    max_oob_rate:         0.05      # ≤ %5 sınır dışı

  # Faz 2 → 3: GAT iletişim katkısı
  phase2_to_3:
    eval_window:          200
    gat_win_improvement:  0.05      # GAT, Faz 1 baseline'dan +5% kazanma

  # Faz 3 → 4: Self-play stabilizasyonu
  phase3_to_4:
    elo_window:           500
    elo_std_max:          50.0      # ELO standart sapması
    min_opponent_variety: 3         # rakip pool boyutu

  # Faz 4 → 5 (Unity): 3v3'e geçiş
  phase4_to_5:
    n_agents_per_team:    3
    min_win_rate_3v3:     0.45


# -----------------------------------------------------------------------------
# LOGGING — Logging ve Checkpoint
# -----------------------------------------------------------------------------
logging:
  log_dir:          "logs/"
  checkpoint_dir:   "checkpoints/"
  wandb_project:    "marl-air-combat"
  wandb_entity:     ""              # WandB kullanıcı adı
  log_interval:     100             # episode
  checkpoint_interval: 1000        # episode
  save_replay:      false           # replay buffer kaydetme (disk yoğun)
  replay_dir:       "replays/"


# -----------------------------------------------------------------------------
# COMMUNICATION — Faz-2 GAT İletişim Modülü
#
# enable_comms: true  → GATMAPPOActor + GATMAPPOCritic kullanılır
#               false → Faz-1 MAPPOActor (varsayılan)
#
# Transfer learning:
#   İlk freeze_steps adım: eski ağırlıklar (fc1_old) dondurulur,
#   sadece GAT + yeni giriş (fc1_new) öğrenir.
#   Sonrası: tüm ağ birlikte fine-tune edilir.
#
# Obs boyutu değişimi:
#   Faz-1: 50D  (17 ego + 9 tm + 12×2 enemy)
#   Faz-2: 68D  (50 base + 2 role_emb + 16 GAT mesajı)
#   Critic: 100D → 136D  (2 ajan × 68D)
# -----------------------------------------------------------------------------
communication:
  enable_comms:  false    # Faz-2 başlatmak için --phase2 argümanı kullan
  node_dim:      17       # ego obs boyutu (cooldown dahil)
  edge_dim:      3        # [distance_norm, bearing_norm, threat]
  n_heads:       4        # attention head sayısı
  msg_dim:       16       # çıkış mesaj boyutu (n_heads × head_dim = 4×4)
  freeze_steps:  0        # eski ağırlıkların dondurulacağı adım sayısı (0=hemen aç)


# -----------------------------------------------------------------------------
# OPPONENT_POOL — Fictitious Self-Play Rakip Havuzu
#
# Policy collapse çözümü: Red takımı sabit heuristic yerine Blue'nun geçmiş
# checkpoint'lerinden örneklenen bir policy kullanır.
#
# Pipeline:
#   0 .. start_step        : rastgele aksiyon (warm-up, exploration)
#   start_step+            : pool'dan seçilen checkpoint (self-play)
#                            pool boşsa heuristic fallback devreye girer
#
# Her pool_update_interval episode'da bir actor snapshot kaydedilir ve
# pool'a eklenir. Ring buffer kapasitesi max_pool_size'dır.
# -----------------------------------------------------------------------------
opponent_pool:
  max_pool_size:          20    # ring buffer kapasitesi (eski checkpoint silinir)
  start_step:        500_000    # bu adımdan itibaren self-play pool kullanılır
  pool_update_interval:  1200    # her 1200 ep'de bir snapshot — hardening oscillation minimize

# -----------------------------------------------------------------------------
# ROLE_EXPLORATION — Epsilon-Greedy Rol Keşfi
# İlk role_epsilon_steps adımda rastgele rol seç → RoleSelector'a çeşitli sinyaller ver
# -----------------------------------------------------------------------------
role_exploration:
  role_epsilon_start:  0.5        # başlangıç keşif oranı (%50 rastgele rol)
  role_epsilon_end:    0.0        # son keşif oranı (tamamen öğrenilmiş)
  role_epsilon_steps:  10_000_000 # bu run'ın başından itibaren lineer decay adım sayısı


# -----------------------------------------------------------------------------
# CURRICULUM_V2 — 3-Fazlı Curriculum (1v1 WEZ-close → 1v1 normal → 2v2)
# -----------------------------------------------------------------------------
curriculum_v2:
  eval_window:              100     # kriter kontrolü için rolling window (episode)

  # Faz 1: 1v1 WEZ-yakın spawn
  phase1_kill_threshold:   0.30     # kill/ep >= 0.30 (son eval_window ep)
  phase1_win_threshold:    0.40     # win_rate >= 0.40 (son eval_window ep)
  phase1_min_episodes:     100      # en az 100 episode Faz-1'de kal
  phase1_spawn_dist_min:   500.0    # WEZ spawn min mesafe (m)
  phase1_spawn_dist_max:  1500.0    # WEZ spawn max mesafe (m)

  # Faz 1.5: 1v1 kademeli mesafe artışı (4000→16000m)
  phase15_dist_start:     4000.0    # başlangıç mesafesi (m) — Faz-1.5 başlangıcı
  phase15_dist_max:      16000.0    # maksimum mesafe (m)
  phase15_dist_step:      1000.0    # her 100 ep'de artış (m)
  phase15_step_episodes:   100      # kaç ep'de bir mesafe güncellenir
  phase15_pullback_thresh:  0.10    # kill/ep bu altına düşerse mesafeyi geri çek
  phase15_kill_threshold:   0.20    # kill/ep >= 0.20 → Faz 2'ye geç
  phase15_min_episodes:    1200     # Faz 1.5'te minimum episode sayısı (4k→16k için)

  # Faz 2: 1v1 normal spawn
  phase2_kill_threshold:   0.15     # kill/ep >= 0.15 → Faz 3'e geç (2v2)
  phase2_min_episodes:     300      # Faz 2'de minimum episode sayısı
  phase3_spawn_dist:      2500.0    # normal spawn min mesafe (m) — geçici 2500m
  phase3_spawn_dist_max: 12000.0    # normal spawn max mesafe (m)

# -----------------------------------------------------------------------------
# QMIX — Hiperparametreler
# -----------------------------------------------------------------------------
qmix:
  # Ağ boyutları
  obs_dim:          50              # ajan gözlem boyutu (50D, MAPPO ile aynı)
  global_obs_dim:   100             # global durum boyutu (2 ajan × 50D)
  n_actions:        162             # ayrık aksiyon sayısı (3×3×3×3×2)
  agent_hidden:     128             # AgentQNetwork gizli katman boyutu
  qmix_hidden:      64              # QMixNet gizli katman boyutu

  # Eğitim hiperparametreleri
  lr:               0.0001          # Adam öğrenme hızı
  gamma:            0.99            # indirim faktörü
  batch_size:       64              # minibatch boyutu
  min_buffer:       1000            # güncelleme için minimum buffer doluluk

  # Replay buffer
  buffer_capacity:  50000           # geçiş sayısı

  # Keşif (ε-greedy)
  eps_start:        1.0             # başlangıç epsilon
  eps_end:          0.05            # son epsilon
  eps_decay_steps:  100000          # lineer decay adım sayısı

  # Senkronizasyon
  target_update_interval: 200       # hedef ağ güncelleme sıklığı (episode)
  train_freq:       4               # kaç adımda bir güncelleme

  # Diğer
  grad_clip:        10.0            # gradyan kırpma
  total_episodes:   30000           # toplam eğitim episode sayısı
  log_interval:     100             # log yazdırma sıklığı (episode)
  save_interval:    500             # checkpoint kaydetme sıklığı (episode)
  pool_update_interval: 500        # her N ep'de AgentQNet snapshot → self-play pool

# -----------------------------------------------------------------------------
# FACMAC — Hiperparametreler
# -----------------------------------------------------------------------------
facmac:
  # Ağ boyutları
  hidden:           256             # actor/critic gizli katman
  qmix_hidden:      64              # QMixNet gizli katman (QMIX ile aynı)

  # Eğitim
  lr_actor:         0.0001          # actor Adam öğrenme hızı
  lr_critic:        0.0001          # critic+mixer Adam öğrenme hızı (1e-3→1e-4, divergence fix)
  gamma:            0.99
  tau:              0.005           # Polyak averaging katsayısı
  batch_size:       256
  min_buffer:       1000
  grad_clip:        1.0             # 10.0→1.0, agresif kırpma ile Q patlamasını engelle

  # Replay buffer
  replay_capacity:  50000           # 10k→50k: curriculum fazları arası dağılım kararlılığı

  # Keşif: ctrl'e Gaussian noise, fire Bernoulli ile doğal
  noise_sigma:      0.1             # başlangıç Gaussian std
  noise_clip:       0.5             # noise clipping sınırı
  noise_decay:      0.9999          # her episode'da noise_sigma *= decay

  # TD3 iyileştirmeleri
  policy_freq:          4           # 2→4: critic daha çok stabilize olsun, sonra actor güncelle
  target_noise_sigma:   0.2         # target policy smoothing std
  target_noise_clip:    0.5         # target noise clamp sınırı
  q_target_clamp:       2000.0      # Faz-4 Q_tot_max~709 (2 ajan+kill bonus) → 2000 güvenli marjin

  # Senkronizasyon & log
  train_freq:       4
  total_episodes:   97000            # ep17000'den ~20M toplam step ≈ 80k ep daha
  log_interval:     100
  save_interval:    500
  pool_update_interval: 1200        # hardening oscillation minimize

# -----------------------------------------------------------------------------
# EVAL — Değerlendirme Ayarları
# -----------------------------------------------------------------------------
eval:
  n_episodes:       20              # değerlendirme episode sayısı
  deterministic:    true            # stokastik değil, greedy aksiyon
  opponents:
    - "heuristic_basic"             # Faz 1 baseline
    - "heuristic_advanced"          # Faz 3+
    - "self"                        # kendi önceki checkpoint'i
  metrics:
    - "win_rate"
    - "loss_rate"
    - "draw_rate"
    - "kill_per_episode"
    - "survival_time"
    - "mean_reward"